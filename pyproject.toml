[project]
name = "rag-demo"
version = "0.1.0"
description = "A Python RAG MVP with strict knowledge-base and skill boundaries."
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.20.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pymilvus[milvus-lite]>=3.0.0",
    "redis>=5.0.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "python-pptx>=0.6.23",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
